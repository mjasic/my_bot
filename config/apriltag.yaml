/**:
  ros__parameters:
    family: "36h11"
    size: 0.08

    # Nazwy i rozmiary poszczegolnych tagow (opcjonalne nadpisanie 'size' powyzej)
    tag:
      ids: [0]
      frames: ["dock_tag"]
      sizes: [0.08]

    max_hamming: 0
    detector:
      threads: 2
      decimate: 2.0  # odciazenie CPU Pi (tag 8 cm widoczny do >1 m)
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
